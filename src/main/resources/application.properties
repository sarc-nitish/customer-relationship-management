# ==============================
# Server config
# ==============================
server.port=8080

# ==============================
# MySQL Database config
# ==============================
spring.datasource.url=jdbc:mysql://localhost:3306/crm_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=enter_passward
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==============================
# JPA / Hibernate config
# ==============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ==============================
# JWT config
# ==============================
# IMPORTANT: production me ye secret .env / environment variable se lena, yahan hardcode mat rakhna
jwt.secret=ThisIsASecretKeyForCRMProjectJWTTokenGenerationChangeItInProduction123
jwt.expiration=86400000

# ==============================
# Swagger / OpenAPI config
# ==============================
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# ==============================
# Jackson / date format
# ==============================
spring.jackson.date-format=yyyy-MM-dd'T'HH:mm:ss
spring.jackson.time-zone=UTC
